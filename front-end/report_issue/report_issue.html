<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>UnivPulse - Report an Issue</title>
<!-- Fonts & Material Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="../student_faculty/student_faculty.css" rel="stylesheet">
<link href="../student_faculty/student_faculty_page.css" rel="stylesheet">
<script src="../assets/tailwind.config.js"></script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body class="bg-surface text-on-surface antialiased selection:bg-secondary selection:text-on-secondary min-h-screen flex flex-col font-body-md">
<!-- Top Navigation Header (Shared Component: TopNavBar) -->
<header class="bg-surface-container-lowest border-b border-outline-variant shadow-sm sticky top-0 z-40">
<div class="flex justify-between items-center w-full px-6 py-3 max-w-7xl mx-auto">
<!-- Brand & Course Metadata -->
<div class="flex items-center gap-3">
<a class="text-headline-sm font-headline-sm font-bold text-primary tracking-tight flex items-center gap-2" href="#">
<span class="w-8 h-8 rounded bg-primary text-surface-container-lowest flex items-center justify-center font-bold text-sm tracking-normal">UP</span>
          UnivPulse
        </a>
<span class="text-label-sm font-label-sm text-outline px-2 py-0.5 border border-outline-variant rounded bg-surface-container-low">UCS503 Course Project</span>

<nav class="hidden md:flex items-center gap-6 ml-4"><a class="text-on-surface-variant hover:text-on-surface text-label-md font-label-md transition-colors pb-1" href="../student_faculty/student_faculty.html">Dashboard</a><a class="border-b-2 border-secondary text-secondary font-semibold pb-1 text-label-md font-label-md" href="#">Report an Issue</a><a class="text-on-surface-variant hover:text-on-surface text-label-md font-label-md transition-colors pb-1" href="../analytics/analytics.html">Analytics</a></nav></div>
<!-- Trailing Action Cluster -->
<div class="flex items-center gap-3">
<button class="p-1.5 text-on-surface-variant hover:text-on-surface rounded transition-colors" title="Notifications">
<span class="material-symbols-outlined text-[20px]">notifications</span>
</button>
<button class="p-1.5 text-on-surface-variant hover:text-on-surface rounded transition-colors" title="Account">
<span class="material-symbols-outlined text-[20px]">account_circle</span>
</button>
</div>
</div>
</header>
<!-- Main Canvas: Report an Issue -->
<main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 py-8 flex flex-col gap-6">
<aside class="bg-surface-container-lowest border border-outline-variant rounded-lg p-5 shadow-sm" id="report-panel">
<div class="flex items-center justify-between border-b border-outline-variant pb-3 mb-4">
<div>
<h2 class="text-headline-sm font-headline-sm text-primary tracking-tight">+ Report an Issue</h2>
<p class="text-label-sm font-label-sm text-outline">Direct ticket dispatch to campus facilities</p>
</div>
<span class="material-symbols-outlined text-outline text-[20px]">assignment_add</span>
</div>
<form class="space-y-4" id="report-form">
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1.5">Photo Evidence <span class="text-outline font-normal">[OPTIONAL]</span></label>
<input id="report-photo" type="file" accept="image/png,image/jpeg,image/webp,image/heic" class="w-full text-body-sm font-body-sm border-2 border-dashed border-outline-variant hover:border-secondary rounded p-3 bg-surface transition-colors cursor-pointer">
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1">Issue Title <span class="text-error text-label-sm font-code-sm">[REQUIRED]</span></label>
<input id="report-title" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-body-md font-body-md text-on-surface placeholder:text-outline focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors" placeholder="e.g. Loose ceiling wire or sink leakage" required type="text">
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1">Category <span class="text-error text-label-sm font-code-sm">[REQUIRED]</span></label>
<select id="report-category" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-body-md font-body-md text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors" required>
<option disabled selected value="">Loading categories&hellip;</option>
</select>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1">Department <span class="text-outline font-normal">[OVERRIDE AUTO-ROUTING]</span></label>
<select id="report-department-override" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-body-md font-body-md text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors">
<option value="">Auto-suggest from category (recommended)</option>
</select>
</div>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1">Building <span class="text-error text-label-sm font-code-sm">*</span></label>
<input id="report-building" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-body-md font-body-md text-on-surface placeholder:text-outline focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors" placeholder="e.g. Hostel-3" required type="text">
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1">Floor <span class="text-error text-label-sm font-code-sm">*</span></label>
<input id="report-floor" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-body-md font-body-md text-on-surface placeholder:text-outline focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors" placeholder="e.g. Ground or 2" required type="text">
</div>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1">Room / Area <span class="text-error text-label-sm font-code-sm">*</span></label>
<input id="report-area-room" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-body-md font-body-md text-on-surface placeholder:text-outline focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors" placeholder="e.g. Room 204 or Boys' Washroom" required type="text">
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1">Description <span class="text-outline font-normal">[DETAILS HELP DISPATCH]</span></label>
<textarea id="report-description" class="w-full bg-surface-container-lowest border border-outline-variant rounded px-3 py-2 text-body-md font-body-md text-on-surface placeholder:text-outline focus:border-secondary focus:ring-1 focus:ring-secondary outline-none transition-colors resize-none" placeholder="Provide context, safety concerns, or specific times issue occurs..." rows="3" required></textarea>
</div>
<p id="report-error" class="hidden text-error text-body-sm font-body-sm"></p>
<button id="report-submit" class="w-full bg-primary hover:bg-primary-container text-on-primary py-2.5 rounded font-title-md text-title-md shadow-sm transition-all duration-150 active:scale-[0.99] flex items-center justify-center gap-2" type="submit">
<span>Submit Report</span>
<span class="material-symbols-outlined text-[18px]">send</span>
</button>
</form>
</aside>
</main>
<!-- Minimal Footer (Shared Component: Footer) -->
<footer class="bg-surface-container-lowest border-t border-outline-variant mt-auto">
<div class="flex flex-col sm:flex-row justify-between items-center w-full px-6 py-4 max-w-7xl mx-auto gap-4">
<div class="flex items-center gap-3">
<span class="text-headline-sm font-headline-sm font-bold text-primary">UnivPulse</span>
<span class="text-on-surface-variant text-body-sm font-body-sm">© 2025 UnivPulse • UCS503 Course Project</span>
</div>
<div class="flex items-center gap-6 text-body-sm font-body-sm">
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Issue Guidelines</a>
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">System Status</a>
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Campus Safety</a>
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
</div>
</div>
</footer>
<script src="../assets/api.js"></script>
<script src="../assets/shared.js"></script>
<script src="report_issue.js"></script>
</body></html>
